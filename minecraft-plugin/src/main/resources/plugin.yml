name: MCTiersTierTest
version: '1.2.2'
main: gg.craked.mctiers.TierTestPlugin
api-version: '1.21'
description: Tier test codes, offline login and skins for MCTiers.
author: crakedmctiers.gg
website: https://crakedmctiers.gg
folia-supported: false

commands:
  tiertest:
    description: Get a tier test code to paste in the website chat.
    usage: /tiertest [reset|list]
    aliases: [tt, tier]
    permission: mctiers.tiertest
  tiers:
    description: Show the tiers you currently hold.
    usage: /tiers
    aliases: [mytiers]
    permission: mctiers.tiers
  register:
    description: Create an offline account and log in.
    usage: /register <password>
    aliases: [reg]
    permission: mctiers.auth
  login:
    description: Log in with an existing offline account.
    usage: /login <password>
    aliases: [l]
    permission: mctiers.auth
  logout:
    description: Log out and return to the void.
    usage: /logout
    permission: mctiers.auth
  skin:
    description: Set your skin to a Mojang skin name.
    usage: /skin <name>
    permission: mctiers.skin

permissions:
  mctiers.tiertest:
    description: Allows a player to request a tier test code.
    default: true
  mctiers.tiers:
    description: Allows a player to see their tiers.
    default: true
  mctiers.tiertest.admin:
    description: Allows staff to list the open tier test requests.
    default: op
  mctiers.auth:
    description: Allows /register, /login and /logout.
    default: true
  mctiers.skin:
    description: Allows /skin.
    default: true
